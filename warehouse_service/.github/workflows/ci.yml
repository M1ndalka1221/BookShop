name: Warehouse Microservice CI

on:
  push:
    paths:
      - 'warehouse_service/**'
  pull_request:
    paths:
      - 'warehouse_service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Run test suite and check coverage
        run: |
          pytest --cov=warehouse --cov=users --cov-report=term-missing --cov-fail-under=70

      - name: Validate Docker build
        run: |
          docker build -t warehouse_service:latest .
