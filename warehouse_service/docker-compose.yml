services:
  warehouse_db:
    image: postgres:15-alpine
    container_name: warehouse_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-warehouse_db}
      POSTGRES_USER: ${DB_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warehouse_password}
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-warehouse_user} -d ${DB_NAME:-warehouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse_redis:
    image: redis:7-alpine
    container_name: warehouse_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  warehouse_web:
    build: .
    container_name: warehouse_web
    restart: always
    environment:
      DJANGO_ENV: production
      DB_HOST: warehouse_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-warehouse_db}
      DB_USER: ${DB_USER:-warehouse_user}
      DB_PASSWORD: ${DB_PASSWORD:-warehouse_password}
      REDIS_URL: redis://warehouse_redis:6379/0
      CELERY_BROKER_URL: redis://warehouse_redis:6379/0
      CELERY_RESULT_BACKEND: redis://warehouse_redis:6379/0
      SERVICE_ACCOUNT_USERNAME: ${SERVICE_ACCOUNT_USERNAME:-bookshop_service}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:-warehouse_secret_pass_2026}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-warehouse-prod-key-12345}
      ALLOWED_HOSTS: localhost,127.0.0.1,warehouse_web,warehouse_nginx
    volumes:
      - warehouse_staticfiles:/app/staticfiles
    depends_on:
      warehouse_db:
        condition: service_healthy
      warehouse_redis:
        condition: service_healthy

  warehouse_celery:
    build: .
    container_name: warehouse_celery
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_ENV: production
      DB_HOST: warehouse_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-warehouse_db}
      DB_USER: ${DB_USER:-warehouse_user}
      DB_PASSWORD: ${DB_PASSWORD:-warehouse_password}
      REDIS_URL: redis://warehouse_redis:6379/0
      CELERY_BROKER_URL: redis://warehouse_redis:6379/0
      CELERY_RESULT_BACKEND: redis://warehouse_redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-django-insecure-warehouse-prod-key-12345}
    depends_on:
      warehouse_db:
        condition: service_healthy
      warehouse_redis:
        condition: service_healthy
      warehouse_web:
        condition: service_started

  warehouse_celery_beat:
    build: .
    container_name: warehouse_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_ENV: production
      DB_HOST: warehouse_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-warehouse_db}
      DB_USER: ${DB_USER:-warehouse_user}
      DB_PASSWORD: ${DB_PASSWORD:-warehouse_password}
      REDIS_URL: redis://warehouse_redis:6379/0
      CELERY_BROKER_URL: redis://warehouse_redis:6379/0
      CELERY_RESULT_BACKEND: redis://warehouse_redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-django-insecure-warehouse-prod-key-12345}
    depends_on:
      warehouse_db:
        condition: service_healthy
      warehouse_redis:
        condition: service_healthy
      warehouse_web:
        condition: service_started

  warehouse_nginx:
    image: nginx:alpine
    container_name: warehouse_nginx
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - warehouse_staticfiles:/app/staticfiles:ro
    depends_on:
      - warehouse_web

volumes:
  warehouse_pgdata:
  warehouse_staticfiles:
