name: Django CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Code Formatting (black)
        run: black --check .

      - name: Lint Code Style (flake8)
        run: flake8 .

  test:
    name: Run Pytest & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bookstore_db
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gettext

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Coverage
        env:
          DJANGO_ENV: development
          SECRET_KEY: 'test-key-ci-only-never-use-in-production'
          DB_NAME: 'bookstore_db'
          DB_USER: 'postgres_user'
          DB_PASSWORD: 'supersecretpassword'
          DB_HOST: 'localhost'
          DB_PORT: '5432'
          REDIS_URL: 'redis://localhost:6379/1'
          CELERY_BROKER_URL: 'redis://localhost:6379/0'
          CELERY_RESULT_BACKEND: 'redis://localhost:6379/0'
          STRIPE_PUBLIC_KEY: 'pk_test_mock'
          STRIPE_SECRET_KEY: 'sk_test_mock'
        run: pytest --cov=. --cov-report=xml

  docker-build-push:
    name: Build & Push Docker Image
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub Credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_TOKEN }}" ]; then
            echo "::error::Missing Docker Hub secret! Please add DOCKERHUB_TOKEN in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'M1ndalka' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            m1ndalka/bookshop:latest
            m1ndalka/bookshop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
