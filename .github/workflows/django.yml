name: Django CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Code Formatting (black)
        run: black --check .

      - name: Lint Code Style (flake8)
        run: flake8 .

  test:
    name: Run Pytest & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bookstore_db
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gettext

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Coverage
        env:
          DJANGO_ENV: development
          SECRET_KEY: 'test-key-ci-only-never-use-in-production'
          DB_NAME: 'bookstore_db'
          DB_USER: 'postgres_user'
          DB_PASSWORD: 'supersecretpassword'
          DB_HOST: 'localhost'
          DB_PORT: '5432'
          REDIS_URL: 'redis://localhost:6379/1'
          CELERY_BROKER_URL: 'redis://localhost:6379/0'
          CELERY_RESULT_BACKEND: 'redis://localhost:6379/0'
          STRIPE_PUBLIC_KEY: 'pk_test_mock'
          STRIPE_SECRET_KEY: 'sk_test_mock'
        run: pytest --cov=. --cov-report=xml --cov-report=term

  docker-build-push:
    name: Build & Push Docker Image
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate & Prepare Docker Hub Credentials
        id: docker_auth
        env:
          CANDIDATE_1: ${{ secrets.DOCKERHUB_TOKEN }}
          CANDIDATE_2: ${{ secrets.M1ndalka }}
          CANDIDATE_3: ${{ secrets.m1ndalka }}
          CANDIDATE_4: ${{ secrets.DOCKER_HUB_TOKEN }}
          CANDIDATE_5: ${{ secrets.DOCKER_PASSWORD }}
          OVERRIDE_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER="m1ndalka"
          if [ -n "$OVERRIDE_USER" ] && [ "$OVERRIDE_USER" != "Mindalka" ] && [ "$OVERRIDE_USER" != "M1ndalka" ]; then
            DOCKER_USER=$(echo "$OVERRIDE_USER" | tr '[:upper:]' '[:lower:]')
          fi

          RAW_TOKEN=""
          # Check all candidate secrets; prioritize one that matches dckr_pat_ pattern
          for c in "$CANDIDATE_1" "$CANDIDATE_2" "$CANDIDATE_3" "$CANDIDATE_4" "$CANDIDATE_5"; do
            if [ -n "$c" ]; then
              if [[ "$c" =~ (dckr_pat_[a-zA-Z0-9_-]+) ]]; then
                RAW_TOKEN="${BASH_REMATCH[1]}"
                break
              fi
              if [ -z "$RAW_TOKEN" ]; then
                RAW_TOKEN="$c"
              fi
            fi
          done

          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Missing Docker Hub secret! Please add DOCKERHUB_TOKEN in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip carriage returns, leading/trailing whitespace, and quotes
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

          if [[ "$CLEAN_TOKEN" =~ (dckr_pat_[a-zA-Z0-9_-]+) ]]; then
            CLEAN_TOKEN="${BASH_REMATCH[1]}"
          fi

          # Detect if the secret is mistakenly set to the username
          if [ "$CLEAN_TOKEN" = "$DOCKER_USER" ] || [ "$CLEAN_TOKEN" = "Mindalka" ] || [ "$CLEAN_TOKEN" = "M1ndalka" ] || [ "$CLEAN_TOKEN" = "m1ndalka" ]; then
            echo "::error::DOCKERHUB_TOKEN cannot be your username ('$CLEAN_TOKEN')! A Personal Access Token (PAT) must be generated at https://hub.docker.com/settings/security -> 'New Access Token' (Permissions: Read & Write). Copy the token value (starts with dckr_pat_...) and save it as DOCKERHUB_TOKEN in GitHub Repository Secrets."
            exit 1
          fi

          echo "Docker Hub Username: $DOCKER_USER"
          echo "Token Length: ${#CLEAN_TOKEN} characters"
          echo "Token Preview: ${CLEAN_TOKEN:0:9}...${CLEAN_TOKEN: -4}"

          # Mask the cleaned token so it is never exposed in logs
          echo "::add-mask::$CLEAN_TOKEN"
          echo "token=$CLEAN_TOKEN" >> "$GITHUB_OUTPUT"
          echo "username=$DOCKER_USER" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.docker_auth.outputs.username }}
          password: ${{ steps.docker_auth.outputs.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            m1ndalka/bookshop:latest
            m1ndalka/bookshop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
