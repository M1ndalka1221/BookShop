{% extends 'base.html' %}

{% block title %}Payment Successful{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow border-success">
            <div class="card-body py-5">
                <h1 class="display-1 text-success mb-3">✅</h1>
                <h2 class="text-success mb-3">Payment Successful!</h2>
                <p class="lead">Thank you for your purchase. Your order has been placed and confirmed.</p>
                <p class="text-muted mb-4">We have sent an order confirmation to your email address.</p>
                <a href="{% url 'catalog:book_list' %}" class="btn btn-outline-primary">Return to Shop</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
